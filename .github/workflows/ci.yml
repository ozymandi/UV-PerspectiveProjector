name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PP_TIME_FACTOR: "3"

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "numpy<2" "opencv-python-headless==4.11.0.86" pillow pytest
      - name: pytest
        run: python -m pytest tests/core -q

  blender:
    name: Blender ${{ matrix.blender }}
    # slow (software rendering): only for PRs into main and manual runs
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        blender: ["4.2.23", "5.3.0"]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libraries (Mesa, Xvfb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1 libglx-mesa0 libegl1 libegl-mesa0 libgl1-mesa-dri \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libsm6 libice6

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender/blender-${{ matrix.blender }}-linux-x64
          key: blender-linux-x64-${{ matrix.blender }}
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          VER=${{ matrix.blender }}
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${VER%.*}/blender-${VER}-linux-x64.tar.xz" | tar -xJ -C ~/blender
      - name: Use Blender
        run: |
          echo "BLENDER=$HOME/blender/blender-${{ matrix.blender }}-linux-x64/blender" >> "$GITHUB_ENV"
          "$HOME/blender/blender-${{ matrix.blender }}-linux-x64/blender" --version | head -n 1

      - name: Cache wheels
        uses: actions/cache@v4
        with:
          path: perspective_projector/wheels
          key: wheels-${{ hashFiles('perspective_projector/blender_manifest.toml') }}
      - name: Fetch wheels
        run: python tools/fetch_wheels.py

      - name: Blender tests (background)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/run_blender.py --ui exclude
      - name: Blender tests (window, non-blocking)
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/run_blender.py --ui only
